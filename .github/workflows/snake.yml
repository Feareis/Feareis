name: Generate snake

on:
  schedule:
    - cron: "17 3 * * *"   # once a day
  workflow_dispatch:        # manual run from the Actions tab
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Generate the snake SVGs
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake.svg?color_snake=#3ECF8E&color_dots=#ebedf0,#c6f2dd,#8fe5bd,#57d79c,#3ECF8E
            dist/snake-dark.svg?palette=github-dark&color_snake=#3ECF8E&color_dots=#161b22,#0e4429,#1b6b45,#2aa06a,#3ECF8E

      - name: Push to the "output" branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
